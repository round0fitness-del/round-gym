name: iPhone app

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

env:
  CI: 'true'
  NPM_CONFIG_YES: 'true'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @capacitor/ios@^7.0.0

      - name: Create the iPhone project
        working-directory: mobile
        shell: bash
        run: |
          rm -rf ios
          if npx cap add ios --packagemanager SPM > add.log 2>&1; then cat add.log; else
            cat add.log
            echo "::warning::SPM $(tail -c 800 add.log | tr '\n\r' '  ')"
            rm -rf ios
            if npx cap add ios > add2.log 2>&1; then cat add2.log; else
              cat add2.log
              echo "::error::ADD $(tail -c 800 add2.log | tr '\n\r' '  ')"
              exit 1
            fi
          fi

      - name: App icon and splash screen
        working-directory: mobile
        continue-on-error: true
        timeout-minutes: 4
        run: npx --no-install capacitor-assets generate --ios --iconBackgroundColor '#161312' --iconBackgroundColorDark '#161312' --splashBackgroundColor '#161312' --splashBackgroundColorDark '#161312' < /dev/null

      - name: Permissions text
        working-directory: mobile
        run: bash scripts/ios-setup.sh

      - name: Sync
        working-directory: mobile
        shell: bash
        run: |
          npx cap sync ios > sync.log 2>&1 || { cat sync.log; echo "::error::SYNC $(tail -c 800 sync.log | tr '\n\r' '  ')"; exit 1; }
          cat sync.log

      - name: Build the app (unsigned)
        working-directory: mobile/ios/App
        shell: bash
        run: |
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          xcodebuild $T -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath "$GITHUB_WORKSPACE/ios-build" \
            MARKETING_VERSION=1.0.${GITHUB_RUN_NUMBER} CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1 || {
              tail -120 build.log
              echo "::error::BUILD $(grep -E 'error' build.log | head -6 | tr '\n\r' '  ' | cut -c1-900)"
              exit 1
            }
          tail -5 build.log

      - name: Make the IPA file
        shell: bash
        run: |
          mkdir -p Payload
          cp -R ios-build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry round-fitness.ipa Payload
          ls -lh round-fitness.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: round-fitness-ipa
          path: round-fitness.ipa

      - name: Publish the download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-test
          name: تطبيق جولة اللياقة · نسخة تجريبية للآيفون
          prerelease: true
          make_latest: false
          files: round-fitness.ipa
          body: |
            نسخة تجريبية للآيفون غير موقعة. تُثبَّت من جهاز ماك ببرنامج Sideloadly وحساب Apple ID.
