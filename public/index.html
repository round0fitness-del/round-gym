.brand .brandlogo{--logo-ink:var(--rail-ink);height:48px}
.lgb .brandlogo{height:62px}
.brand{flex-direction:column!important;align-items:flex-start!important;gap:6px!important}
.lgb{flex-direction:column!important;align-items:flex-start!important;gap:6px!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.num,td.num{font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:22px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{display:block;font:700 24px/1.1 var(--f-display)}
.brand small{display:block;color:var(--rail-muted);font-size:12px;line-height:1.3;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.grp{font-size:11.5px;color:var(--rail-muted);padding:14px 10px 5px;letter-spacing:.04em}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--rail-muted);text-decoration:none;font-weight:500}
.nav a:hover{color:var(--rail-ink);background:rgba(255,255,255,.05)}
.nav a[aria-current="page"]{background:var(--rail-active);color:#fff}
.rfoot{display:grid;gap:10px;padding:0 6px}
.rfoot p{font-size:11.5px;color:var(--rail-muted);line-height:1.6}
.rfoot .btn{background:transparent;color:var(--rail-ink);border-color:rgba(255,255,255,.16);justify-content:center}
.rfoot .btn:hover{background:rgba(255,255,255,.07)}

.main{--gut:28px;min-width:0;padding-block:22px 56px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.top{display:none}
.scrim{display:none}

.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:26px;font-weight:600;line-height:1.25}
.ph p{color:var(--muted);margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;line-height:1.25;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.bad{color:var(--bad)}
.btn.bad.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.ib{background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:inherit}
.ib:hover{background:var(--surface-2)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>header h2{font-size:15px;font-weight:600}
.pb{padding:16px}
.grid{display:grid;gap:16px;margin-top:16px}
.g2{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.g2b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.strip.s4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi span{display:block;color:var(--muted);font-size:12.5px}
.kpi b{display:block;font:600 26px/1.25 var(--f-display);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi b small{font-size:13px;font-weight:500;color:var(--muted)}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:1px}
.kpi.hot b{color:var(--bad)}
.kpi.good b{color:var(--good)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}

.tools{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools input[type=search]{flex:1 1 220px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12.5px;font-weight:500}
.chip em{font-style:normal;color:var(--muted);margin-inline-start:3px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] em{color:inherit}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:12px;font-weight:500;color:var(--muted);padding:9px 14px;white-space:nowrap;background:var(--surface-2)}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:end}
tbody tr:hover td{background:var(--surface-2)}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-align:start}
.link:hover{color:var(--accent)}
.cell-acts{display:flex;gap:6px;justify-content:flex-end}

.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow .link,.row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;color:var(--muted);font-size:12.5px}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px var(--f-display);flex:none}
.tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab em{font-style:normal;margin-inline-start:4px;font-size:12px}

.chart{display:block;width:100%;height:auto;direction:ltr}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--muted);font:11px var(--f-body)}
.chart .b-acc{fill:var(--accent)}
.chart .b-mut{fill:var(--muted);opacity:.5}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .ln2{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.chart .area{fill:var(--accent);opacity:.13}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2.4px solid var(--accent);vertical-align:middle;margin-inline-end:6px}
.legend i.d{border-top:1.5px dashed var(--muted)}
.legend i.sq{width:10px;height:10px;border:0;background:var(--accent);border-radius:2px}
.legend i.sq.m{background:var(--muted);opacity:.5}
.bignum{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px}
.bignum b{font:600 30px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.bignum span{color:var(--muted);font-size:13px}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn>i{background:var(--warn)}
.bar.full>i{background:var(--bad)}
.hm{display:grid;grid-template-columns:62px repeat(19,minmax(0,1fr));gap:3px;min-width:600px;direction:ltr;align-items:center}
.hm .hl{font-size:11.5px;color:var(--muted);text-align:center}
.hm .dl{font-size:12px;color:var(--muted);text-align:start}
.hm .c{height:22px;border-radius:4px;background:color-mix(in srgb,var(--accent) calc(var(--v) * 100%),var(--surface-2))}

.fm{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.fm .full{grid-column:1/-1}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:12.5px;color:var(--muted);font-weight:500}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;min-height:40px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.6}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.days input{width:auto;min-height:0}
.note{font-size:12.5px;color:var(--muted)}
.sumline{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:9px;padding:10px 12px}
.sumline b{font:600 18px var(--f-display)}

.ov{position:fixed;inset:0;background:rgba(5,12,10,.58);display:grid;place-items:center;padding:16px;z-index:100;overflow-y:auto}
.dlg{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;font:400 14px/1.6 var(--f-body)}
.dlg.wide{width:min(780px,100%)}
.dlg>header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg>header h3{font-size:16px;font-weight:600}
.dlg footer{display:flex;gap:8px;justify-content:flex-start;padding:12px 16px;border-top:1px solid var(--line);grid-column:1/-1}
.dlg form{display:block}
.dlg .fm{padding-bottom:12px}
.dlg footer{padding:12px 16px}
.prof{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:16px;align-items:start}
.qrbox{background:#fff;border-radius:10px;padding:10px;width:128px;text-align:center;border:1px solid var(--line)}
.qrbox>div{display:grid;place-items:center;min-height:100px}
.qrbox small{display:block;color:#222;font-family:var(--f-mono);font-size:11px;margin-top:4px}
.sec{padding:0 16px 16px}
.sec h4{margin:0 0 8px;font:600 14px var(--f-display)}
.chipline{display:flex;gap:6px;flex-wrap:wrap}
.chipline span{background:var(--surface-2);border-radius:7px;padding:2px 9px;font-size:12.5px}

.ci-in{display:flex;gap:10px}
.ci-in input{font-size:18px;min-height:52px;font-family:var(--f-display)}
.sug{display:grid;gap:0;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sug:empty{display:none}
.sug button{display:flex;gap:12px;align-items:center;background:var(--surface);border:0;border-top:1px solid var(--line);padding:10px 12px;cursor:pointer;text-align:start;width:100%}
.sug button:first-child{border-top:0}
.sug button:hover{background:var(--surface-2)}
.res{border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;gap:14px;align-items:flex-start;margin-top:14px}
.res.ok{border-color:var(--good);background:var(--good-soft)}
.res.warn{border-color:var(--warn);background:var(--warn-soft)}
.res.deny{border-color:var(--bad);background:var(--bad-soft)}
.res h3{font-size:20px;font-weight:600}
.res .big{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);}
.res.ok .big{color:var(--good)} .res.warn .big{color:var(--warn)} .res.deny .big{color:var(--bad)}
.res .meta{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.res .acts{margin-top:10px}

.wk{display:grid;grid-template-columns:90px minmax(0,1fr)}
.wk>div{padding:10px 16px;border-top:1px solid var(--line)}
.wk>div:nth-child(-n+2){border-top:0}
.wk .dn{font-weight:600}
.wk .dn.today{color:var(--accent)}
.sess{display:inline-flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:8px;padding:3px 10px;margin:2px 4px 2px 0;font-size:13px}
.sess b{font-variant-numeric:tabular-nums}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1}

.lg{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lgc{width:min(480px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px;min-width:0}
.lgb{display:flex;align-items:center;gap:11px}
.lgb b{display:block;font:700 26px/1.1 var(--f-display)}
.lgb small{display:block;color:var(--muted);font-size:12.5px}
.lgsep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:4px 0 0}
.lgsep::before,.lgsep::after{content:"";flex:1;border-top:1px solid var(--line)}
.lgrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.lgrow>div{flex:1 1 200px;min-width:0}
.lgrow b{display:block}
.lgrow small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.lgrow select{flex:1 1 160px;min-height:36px;padding:6px 10px}
.prev{margin-top:4px;background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;line-height:1.7}
.vh{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
label.btn{position:relative;overflow:hidden}
.badge{font-style:normal;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;margin-inline-start:auto;line-height:1.7}
.mode{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;background:rgba(255,255,255,.06);border-radius:9px;padding:6px 6px 6px 10px}
.mode .btn{background:transparent;color:var(--rail-ink);border-color:rgba(255,255,255,.16)}
.mnav{display:flex;align-items:center;gap:10px}
.mnav b{min-width:120px;text-align:center;font-family:var(--f-display)}
table.sch td{vertical-align:top}
.sch tr.today td{background:var(--accent-soft)}
.sch tr.off td{opacity:.55}
.sch tr.frz td{background:var(--info-soft)}
.cls{display:inline-flex;flex-direction:column;gap:1px;margin:2px 0 2px 6px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:start;color:var(--ink)}
button.cls{cursor:pointer}
button.cls:hover{border-color:var(--accent)}
.cls.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cls.full:not(.on){opacity:.55}
.cls small{color:var(--muted);font-size:11.5px}
.cls.on small{color:inherit;opacity:.85}
.gate{max-width:640px;margin:0 auto}
#gin{font-size:24px;min-height:64px;text-align:center;font-family:var(--f-mono);border-width:2px;border-color:var(--accent)}
.gidle{text-align:center;color:var(--muted);padding:36px 16px;display:grid;gap:8px;justify-items:center}
.gidle h2{font-size:20px;color:var(--ink)}
.gres{margin-top:14px;min-height:200px}
.gres .res{margin-top:0;padding:22px}
.gres .res h3{font-size:24px}
.pcard{background:var(--rail);color:var(--rail-ink);border-radius:14px;padding:20px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;min-width:0}
.pcard h2{font-size:22px;font-weight:600}
.pcard .big{font:600 44px/1.2 var(--f-display);margin:10px 0 8px;font-variant-numeric:tabular-nums}
.pcard .bar{background:rgba(255,255,255,.18);min-width:200px}
.pcard .bar>i{background:var(--accent)}
.pcard .pill{background:rgba(255,255,255,.12);color:var(--rail-ink)}
.qrw{background:#fff;border-radius:12px;padding:12px;text-align:center;color:#222}
.qrw>div{display:grid;place-items:center}
.qrw small{display:block;font-family:var(--f-mono);font-size:11px;margin-top:4px}
.inc{display:flex;align-items:center;gap:10px;width:100%;margin:14px 0 2px;padding:10px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--rail-ink);cursor:pointer;text-align:start;font:inherit}
.inc:hover{background:rgba(255,255,255,.09)}
.inc .ico{width:38px;height:38px;border-radius:10px;background:var(--good);color:#fff;display:grid;place-items:center;flex:none}
.inc .tx{min-width:0}
.inc small{display:block;font-size:11.5px;color:var(--rail-muted)}
.inc b{display:block;font:600 18px/1.25 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.inc-t{color:var(--good);border-color:var(--good-soft);background:var(--good-soft)}
.inc-t b{font-variant-numeric:tabular-nums}
.inq{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;font-weight:500}
.inq input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
.res.info{border-color:var(--info);background:var(--info-soft)}
.res.info .big{color:var(--info)}
.bdm{display:flex;gap:6px;align-items:center;color:var(--accent);font-weight:600}
.boxbal{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.boxbal .big{width:56px;height:56px;border-radius:14px;background:var(--good-soft);color:var(--good);display:grid;place-items:center;flex:none}
.boxbal b{display:block;font:600 32px/1.2 var(--f-display);color:var(--good);font-variant-numeric:tabular-nums}
.boxbal .note{display:block}
.dnav{display:flex;gap:6px;align-items:center}
.dnav input{width:auto;min-height:32px;padding:4px 8px}
tr.tot td{font-weight:600;background:var(--surface-2)}
td.in{color:var(--good)}td.out{color:var(--bad)}
.mc{position:relative;overflow:clip;isolation:isolate;width:100%;max-width:440px;min-height:262px;background:var(--rail);color:var(--rail-ink);border-radius:18px;padding:18px 20px 14px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;box-shadow:0 22px 44px -22px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06);text-align:start}
.mc::before,.mc::after{content:"";position:absolute;z-index:-1;inset-block:-30%;transform:skewX(-24deg)}
.mc::before{inset-inline-end:-6%;width:34%;background:var(--accent)}
.mc::after{inset-inline-end:31%;width:5%;background:var(--accent);opacity:.45}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mc-logo{--logo-ink:var(--rail-ink);height:30px}
.mc-tag{font-size:11px;letter-spacing:.08em;opacity:.75;color:#fff;background:rgba(0,0,0,.22);padding:3px 9px;border-radius:999px}
.mc-body{display:flex;justify-content:space-between;align-items:center;gap:14px;min-width:0}
.mc-info{display:grid;gap:1px;min-width:0}

function pageReports(){
 const t=TODAY(),months=[];
 for(let k=5;k>=0;k--){const d=parse(t);d.setDate(1);d.setMonth(d.getMonth()-k);months.push(ymd(d).slice(0,7))}
 const lab=k=>parse(k+'-01').toLocaleDateString(LOC,{month:'short'});
 const bars=groupBars(months.map(lab),[{name:'الإيرادات',cls:'b-acc',vals:months.map(revMonth)},{name:'المصروفات',cls:'b-mut',vals:months.map(expMonth)}],{label:'الإيرادات والمصروفات لآخر 6 أشهر'});
 const from60=addDays(t,-60),ended=S.subs.filter(s=>!s.cancelled&&s.end>=from60&&s.end<t);
 const renewed=ended.filter(s=>S.subs.some(o=>o.memberId===s.memberId&&!o.cancelled&&o.id!==s.id&&o.end>s.end)).length;
 const rate=ended.length?Math.round(renewed/ended.length*100):null;
 const att30=S.att.filter(a=>a.date>addDays(t,-30)).length;
 const recent=S.subs.filter(s=>!s.cancelled&&s.start>=addDays(t,-90));
 const avg=recent.length?Math.round(recent.reduce((a,s)=>a+s.total,0)/recent.length):0;
 const ad=attnData();
 const from90=addDays(t,-90),pm=S.plans.map(p=>{const ss=S.subs.filter(s=>s.planId===p.id&&!s.cancelled&&s.start>=from90);const rv=S.pay.filter(x=>ss.some(s=>s.id===x.subId)).reduce((a,x)=>a+x.amount,0);return {p:p,n:ss.length,rv:rv}});
 const mxn=Math.max(1,Math.max.apply(null,pm.map(x=>x.n)));
 const grid=DOW.map(()=>Array(19).fill(0)),from=addDays(t,-60);
 S.att.forEach(a=>{if(a.date>=from){const h=+a.time.slice(0,2);if(h>=5&&h<=23)grid[parse(a.date).getDay()][h-5]++}});
 let mx=1,pk=[0,0];grid.forEach((r,d)=>r.forEach((v,h)=>{if(v>mx){mx=v;pk=[d,h+5]}}));
 const order=[0,1,2,3,4,5,6];
 const hm='<div class="hm"><span></span>'+Array.from({length:19},(_,i)=>'<span class="hl">'+((i+5)%3===0?fh(i+5):'')+'</span>').join('')+order.map(d=>'<span class="dl">'+DOW[d]+'</span>'+grid[d].map((v,i)=>'<span class="c" style="--v:'+(v/mx).toFixed(2)+'" title="'+DOW[d]+' '+fh(i+5)+': '+v+' زيارة"></span>').join('')).join('')+'</div>';
 const away=ad.away.slice(0,6).map(x=>'<div class="row"><span class="av">'+esc(initial(x.m.name))+'</span><div class="grow"><button type="button" class="link" data-act="openMember" data-id="'+x.m.id+'">'+esc(x.m.name)+'</button><small>'+(x.lv?'آخر حضور '+rel(x.lv):'لم يحضر بعد')+'</small></div><a class="btn sm" target="_blank" rel="noopener" href="'+waLink(x.m,'away')+'">'+ic('msg',14)+' تواصل</a></div>').join('')||'<p class="empty">لا يوجد أعضاء معرضون للانقطاع.</p>';
 return head('التقارير','أداء آخر 6 أشهر ومؤشرات الاحتفاظ بالأعضاء',btn('copyPayments','نسخ المدفوعات (CSV)'))+
 '<div class="strip s4"><div class="kpi"><span>معدل التجديد (آخر 60 يوماً)</span><b>'+(rate===null?'-':rate+'%')+'</b><em>'+renewed+' من '+ended.length+' اشتراكاً منتهياً</em></div><div class="kpi"><span>متوسط الحضور اليومي</span><b>'+(att30/30).toFixed(1)+'</b><em>آخر 30 يوماً</em></div><div class="kpi"><span>متوسط قيمة الاشتراك</span><b>'+num(avg)+' <small>ر.س</small></b><em>آخر 90 يوماً</em></div><div class="kpi'+(ad.away.length?' hot':'')+'"><span>معرضون للانقطاع</span><b>'+ad.away.length+'</b><em>غياب '+S.settings.churnDays+' يوماً أو أكثر</em></div></div>'+
 '<div class="grid g2"><section class="panel"><header><h2>الإيرادات والمصروفات</h2><div class="legend"><span><i class="sq"></i>الإيرادات</span><span><i class="sq m"></i>المصروفات</span></div></header><div class="pb">'+bars+'</div></section>'+
 '<section class="panel"><header><h2>الباقات (آخر 90 يوماً)</h2></header><div class="pb" style="display:grid;gap:14px">'+pm.map(x=>'<div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><b>'+esc(x.p.name)+'</b><span class="num mut">'+x.n+' اشتراك · '+money(x.rv)+'</span></div><div class="bar"><i style="width:'+Math.round(x.n/mxn*100)+'%"></i></div></div>').join('')+'</div></section></div>'+
 '<div class="grid g2"><section class="panel"><header><h2>ساعات الازدحام</h2><span class="note">الذروة: '+(mx>1?DOW[pk[0]]+' '+fh(pk[1]):'-')+'</span></header><div class="pb tw">'+hm+'</div></section>'+
 '<section class="panel"><header><h2>أعضاء يحتاجون تواصلاً</h2></header>'+away+'</section></div>';
}

/* ---------- modal + toast ---------- */
let lastFocus=null,toastT=null;
function toast(msg){const t=$('#toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function closeModal(){const m=$('#modal');if(m){m.remove();if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus()}}
function openModal(title,body,onSubmit,o){
 o=o||{};
 if(!$('#modal'))lastFocus=document.activeElement;else{const old=$('#modal');old.remove()}
 const ov=document.createElement('div');ov.className='ov';ov.id='modal';ov.dir='rtl';ov.lang='ar';
 const foot=o.noForm?'':'<footer><button type="submit" class="btn '+(o.danger?'bad solid':'pri')+'">'+(o.ok||'حفظ')+'</button><button type="button" class="btn" data-act="closeModal">إلغاء</button></footer>';
 ov.innerHTML='<div class="dlg'+(o.wide?' wide':'')+'" role="dialog" aria-modal="true" aria-labelledby="mtt"><header><h3 id="mtt">'+title+'</h3><button type="button" class="ib" data-act="closeModal" aria-label="إغلاق">'+ic('x',20)+'</button></header><form id="mform" autocomplete="off">'+body+foot+'</form></div>';
 document.body.appendChild(ov);
 const f=ov.querySelector('form');
 f.addEventListener('submit',e=>{e.preventDefault();if(onSubmit){const r=onSubmit(Object.fromEntries(new FormData(f)),new FormData(f));if(r===false||r==='keep')return}closeModal()});
 if(o.mount)o.mount(f);
 if(!o.noFocus){const first=f.querySelector('input:not([type=hidden]):not([readonly]),select,textarea');if(first)first.focus()}
}
const fld=(label,inner,cls)=>'<label class="fld '+(cls||'')+'"><span>'+label+'</span>'+inner+'</label>';
const inp=(name,val,a)=>'<input name="'+name+'" id="f-'+name+'" value="'+esc(val==null?'':val)+'" '+(a||'')+'>';
const sel=(name,opts,val,a)=>'<select name="'+name+'" id="f-'+name+'" '+(a||'')+'>'+opts.map(o=>'<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
const confirmModal=(title,text,ok,fn,danger)=>openModal(title,'<div class="fm"><p class="full">'+text+'</p></div>',()=>{fn()},{ok:ok,danger:danger,noFocus:true});
const trainerOpts=()=>[['','بدون مدرب']].concat(S.trainers.map(t=>[t.id,t.name]));

function subModal(memberId){
 if(!S.plans.length){toast('أضف باقة أولاً');return}
 const memberField=memberId?'<input type="hidden" name="memberId" value="'+memberId+'">'+fld('العضو','<input value="'+esc(memberById(memberId).name)+'" readonly>','full'):fld('العضو',sel('memberId',[['','اختر العضو']].concat(S.members.map(m=>[m.id,m.name+' - '+m.code])),'','required'),'full');
 openModal('اشتراك جديد','<div class="fm">'+memberField+
  fld('الباقة',sel('planId',S.plans.map(p=>[p.id,p.name+' - '+p.days+' يوم - '+num(p.price)+' ر.س']),S.plans[0].id),'full')+
  fld('تاريخ البداية',inp('start',memberId?startFor(memberId):TODAY(),'type="date" required'))+
  fld('خصم (ر.س)',inp('disc','0','type="number" min="0" step="1"'))+
  fld('المدفوع الآن (ر.س)',inp('paid','','type="number" min="0" step="0.01" required'))+
  fld('طريقة الدفع',sel('method',Object.keys(METH).map(k=>[k,METH[k]]),'cash'))+
  fld('أيام التجميد المسموحة',inp('freezeMax',S.plans[0].freeze||0,'type="number" min="0" max="365"'))+
  '<p class="note">يحدد الحد الأقصى للتجميد في هذا الاشتراك. أي تجميد يحتاج موافقة المدير.</p>'+
  '<div class="sumline full"><span>الإجمالي بعد الخصم</span><b class="num" id="tot">0</b></div></div>',
  d=>{
   if(!d.memberId){toast('اختر العضو');return false}
   const p=planById(d.planId),disc=Math.max(0,+d.disc||0),total=Math.max(0,p.price-disc),paid=Math.max(0,+d.paid||0);
   if(paid>total){toast('المدفوع أكبر من الإجمالي');return false}

  },{ok:'إنشاء الاشتراك',mount:f=>{

   f.addEventListener('input',e=>{if(e.target.name==='paid')touched=true;if(e.target.name==='freezeMax')ftouch=true;calc()});calc();
  }});

function drawQR(selector,m,size){
 const el=$(selector);if(!el)return;
 try{if(window.QRCode){el.innerHTML='';new QRCode(el,{text:qrPayload(m),width:size,height:size,colorDark:'#000000',colorLight:'#ffffff'})}else el.textContent=m.code}catch(e){el.textContent=m.code}
}
function decodeQrFile(file,cb){
 const rd=new FileReader();
 rd.onload=()=>{const img=new Image();
  img.onload=()=>{
   const sc=Math.min(1,1000/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc)),cv=document.createElement('canvas');
   cv.width=w;cv.height=h;
   let res=null;
   try{const cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);if(window.jsQR){const d=cx.getImageData(0,0,w,h);res=window.jsQR(d.data,d.width,d.height)}}catch(e){}
   cb(res?res.data:null)};
  img.onerror=()=>cb(null);img.src=rd.result};
 rd.onerror=()=>cb(null);rd.readAsDataURL(file);
}

function scheduleTable(m,ym,editable){
 const t=TODAY(),p=ym.split('-').map(Number),dim=new Date(p[0],p[1],0).getDate();
 const subs=S.subs.filter(s=>s.memberId===m.id&&!s.cancelled);
 const inSub=d=>subs.some(s=>s.start<=d&&d<=s.end);
 const frz=d=>subs.some(s=>(s.freezes||[]).some(f=>f.from<=d&&d<=f.to));
 const att=new Set(S.att.filter(a=>a.memberId===m.id).map(a=>a.date));
 let rows='';
 for(let k=1;k<=dim;k++){
  const d=ym+'-'+pad(k),dow=parse(d).getDay();
  const cls=S.classes.filter(c=>c.days.indexOf(dow)>=0).sort((a,b)=>a.time.localeCompare(b.time));
  const ins=inSub(d),fz=frz(d),can=editable&&ins&&!fz&&d>=t;
  const chips=cls.map(c=>{
   const on=S.book.some(b=>b.classId===c.id&&b.date===d&&b.memberId===m.id),full=!on&&bookedCount(c.id,d)>=c.cap,tr=trainerById(c.trainerId);
   const inner='<span><b>'+ft(c.time)+'</b> '+esc(c.name)+(on?' ✓':'')+'</span><small>'+esc(tr?tr.name:'بدون مدرب')+' · '+c.dur+' دقيقة'+(full?' · مكتملة':'')+'</small>';
   return can?'<button type="button" class="cls'+(on?' on':'')+(full?' full':'')+'" data-act="togBook" data-cid="'+c.id+'" data-d="'+d+'" data-mid="'+m.id+'" aria-pressed="'+on+'">'+inner+'</button>':'<span class="cls'+(on?' on':'')+'">'+inner+'</span>';
  }).join('')||'<span class="mut">لا توجد حصص</span>';
  const state=fz?'<span class="pill info">تجميد</span>':!ins?'<span class="note">خارج الاشتراك</span>':att.has(d)?'<span class="pill good">حضر</span>':d===t?'<span class="pill warn">اليوم</span>':'';
  rows+='<tr class="'+(d===t?'today':!ins?'off':fz?'frz':'')+'"><td class="num" style="white-space:nowrap">'+fdate(d,{day:'numeric',month:'short'})+'</td><td style="white-space:nowrap">'+DOW[dow]+'</td><td>'+chips+'</td><td>'+state+'</td></tr>';
 }
 return '<table class="sch"><thead><tr><th>التاريخ</th><th>اليوم</th><th>الحصص: الاسم والوقت والمدرب</th><th>الحالة</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function wChart(log){
 if(log.length<2)return '<p class="note">أضف قياسين على الأقل لعرض منحنى الوزن.</p>';
 const W=640,H=170,pl=40,pr=12,pt=14,pb=24,iw=W-pl-pr,ih=H-pt-pb,ws=log.map(x=>x.weight),mn=Math.floor(Math.min.apply(null,ws)-1),mx=Math.ceil(Math.max.apply(null,ws)+1);
 const X=i=>pl+iw*i/(log.length-1),Y=v=>pt+ih-ih*(v-mn)/(mx-mn);

const ROLES={manager:{name:'مدير',pages:null},reception:{name:'استقبال',pages:['daily','leads','dashboard','members','newmember','subs','requests','schedule','portal','gate','checkin','classes','marketing']},trainer:{name:'مدرب',pages:['trainer','classes']},trainee:{name:'متدرب',pages:['portal']}};
let SESS=null;
const can=k=>{if(!SESS)return false;const r=ROLES[SESS.role];return !r.pages||r.pages.indexOf(k)>=0};
const isManager=()=>!!SESS&&SESS.role==='manager';
const isStaff=()=>!!SESS&&(SESS.role==='manager'||SESS.role==='reception');
const landing=()=>SESS.role==='trainer'?'trainer':SESS.role==='trainee'?'portal':'dashboard';
const SYNC_COLS=['members','subs','pay','exp','att','classes','book','freezeReq','pt','campaigns','daily','leads','cash','plans','trainers'];

async function api(path,opt){
 opt=opt||{};
 let r;
 try{r=await fetch('/api/'+path,{method:opt.method||'GET',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'gym'},body:opt.body?JSON.stringify(opt.body):undefined})}
 catch(e){const err=new Error('تعذّر الاتصال بالخادم');err.status=0;throw err}
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok){const err=new Error((j&&j.error)||('خطأ '+r.status));err.status=r.status;throw err}
 return j;
}
const clone=o=>JSON.parse(JSON.stringify(o));
function hydrate(raw){
 raw=raw||{};const o=Object.assign(wipeState(),clone(raw));
 o.settings=Object.assign(wipeState().settings,raw.settings||{});
 o.settings.tpl=Object.assign({},DEFAULT_TPL,(raw.settings&&raw.settings.tpl)||{});
 SYNC_COLS.forEach(c=>{if(!Array.isArray(o[c]))o[c]=[]});
 if(!raw.plans&&isManager())o.plans=basePlans();
 o.nextCode=Math.max(raw.nextCode||1001,o.members.reduce((a,m)=>Math.max(a,(parseInt(String(m.code).replace(/\D/g,''),10)||0)+1),1001));
 o.nextInv=Math.max(raw.nextInv||1,o.subs.reduce((a,s)=>Math.max(a,(parseInt(String(s.inv).replace(/\D/g,''),10)||0)+1),1));
 o.v=1;o.v2=1;o.v3=1;
 return o;
}
const Sync=(function(){
 let BASE=null,rev=0,timer=null,busy=false,again=false,state='ok',pollT=null,pending=false;
 function setStatus(k){state=k;const el=$('#syncst');if(!el)return;
  const t={ok:'متصل · كل التغييرات محفوظة',saving:'جارٍ الحفظ…',pending:'جارٍ الحفظ…',off:'غير متصل · سيُحفظ عند عودة الاتصال',err:'تعذّر حفظ آخر تغيير'}[k];
  el.textContent=t;el.className='sync '+k}
 function diff(){
  const ops=[];if(!BASE)return ops;
  SYNC_COLS.forEach(c=>{
   const a=BASE[c]||[],b=S[c]||[],am=new Map(a.map(x=>[x.id,x])),seen=new Set();
   b.forEach(x=>{if(!x||!x.id)return;seen.add(x.id);const o=am.get(x.id);if(!o||JSON.stringify(o)!==JSON.stringify(x))ops.push({c:c,op:'put',v:x})});
   a.forEach(x=>{if(x&&x.id&&!seen.has(x.id))ops.push({c:c,op:'del',id:x.id})});
  });
  if(isManager()&&JSON.stringify(BASE.settings)!==JSON.stringify(S.settings))ops.push({c:'settings',op:'set',v:S.settings});
  if(isStaff())['nextCode','nextInv'].forEach(k=>{if((S[k]||0)>(BASE[k]||0))ops.push({c:'meta',op:'max',k:k,v:S[k]})});
  return ops;
 }
 function adopt(raw,r){
  S=hydrate(raw);BASE=clone(S);
  if(isManager()){if(!raw.plans)BASE.plans=[];if(!raw.settings)BASE.settings={}}
  rev=r;
 }
 async function load(){const j=await api('state');U.warn=j.warn||'';adopt(j.state,j.rev);if(diff().length)queue()}
 function queue(){pending=true;setStatus('pending');clearTimeout(timer);timer=setTimeout(flush,350)}
 async function flush(){
  clearTimeout(timer);
  if(busy){again=true;return}
  const ops=diff();
  if(!ops.length){pending=false;setStatus('ok');return}
  busy=true;setStatus('saving');
  const snap=clone(S);
  try{
   const r=await api('sync',{method:'POST',body:{ops:ops}});
   BASE=snap;rev=r.rev;pending=false;
   let changed=false;
   Object.keys(r.remap&&r.remap.members||{}).forEach(id=>{const v=r.remap.members[id];[S,BASE].forEach(o=>{const m=o.members.find(x=>x.id===id);if(m)m.code=v});changed=true});
   Object.keys(r.remap&&r.remap.subs||{}).forEach(id=>{const v=r.remap.subs[id];[S,BASE].forEach(o=>{const s=o.subs.find(x=>x.id===id);if(s)s.inv=v});changed=true});
   if(changed)safeRender();
   setStatus('ok');
  }catch(e){
   if(e.status===401){toast('انتهت الجلسة، سجّل الدخول مرة أخرى');setTimeout(()=>location.reload(),1200);return}
   if(e.status===0||e.status>=500||e.status===429){setStatus('off');setTimeout(flush,5000)}
   else{setStatus('err');toast('لم يُحفظ التغيير: '+e.message);try{await load();safeRender()}catch(x){}}
  }finally{busy=false;if(again){again=false;flush()}}
 }
 function safeRender(){
  if(!SESS||!$('.shell'))return;
  const a=document.activeElement,inView=a&&a.closest&&a.closest('#view')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName),typing=inView&&(a.tagName!=='INPUT'||a.value);
  if($('#modal')||typing){setTimeout(safeRender,2500);return}
  const y=window.scrollY,fid=inView&&a.id;render();window.scrollTo(0,y);
  if(fid){const f=document.getElementById(fid);if(f)f.focus()}
 }
 function applyChanges(list){
  list.forEach(e=>{
   [S,BASE].forEach(o=>{
    if(e.c==='settings'){o.settings=Object.assign({},o.settings,clone(e.v));return}
    const arr=o[e.c]||(o[e.c]=[]),i=arr.findIndex(x=>x.id===(e.op==='put'?e.v.id:e.id));
    if(e.op==='put'){if(i>=0)arr[i]=clone(e.v);else arr.push(clone(e.v))}else if(i>=0)arr.splice(i,1);
   });
  });
 }
 async function poll(){
  if(busy||pending||document.hidden)return;
  try{
   const r=await api('rev');setStatus('ok');
   if(r.rev===rev||diff().length)return;
   if(isStaff()){
    const c=await api('changes?since='+rev);
    if(diff().length)return;
    if(c.full){await load()}else{applyChanges(c.changes);rev=c.rev}
   }else await load();
   safeRender();
  }catch(e){if(e.status===401){location.reload();return}setStatus('off')}
 }
 function startPolling(){clearInterval(pollT);pollT=setInterval(poll,8000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()})}
 window.addEventListener('beforeunload',e=>{if(pending||busy){e.preventDefault();e.returnValue=''}});
 return {load:load,queue:queue,flush:flush,startPolling:startPolling,status:()=>setStatus(state),reset:()=>{BASE=null;rev=0;clearInterval(pollT)}};
})();

function segMembers(key){
 const t=TODAY();let list;
 if(key.indexOf('plan:')===0){const id=key.slice(5);list=S.members.filter(m=>{const i=mInfo(m);return i.sub&&i.sub.planId===id&&(i.st==='active'||i.st==='expiring')})}
 else if(key.indexOf('trainer:')===0){const id=key.slice(8);list=S.members.filter(m=>m.trainerId===id)}
 else{
  const ad=attnData();
  if(key==='all')list=S.members.slice();
  else if(key==='active')list=S.members.filter(m=>{const s=mInfo(m).st;return s==='active'||s==='expiring'});
  else if(key==='expiring')list=ad.expiring.map(x=>x.m);
  else if(key==='expired')list=S.members.filter(m=>mInfo(m).st==='expired');
  else if(key==='away')list=ad.away.map(x=>x.m);
  else if(key==='new30')list=S.members.filter(m=>m.joined>=addDays(t,-30));
  else if(key==='none')list=S.members.filter(m=>mInfo(m).st==='none');
  else if(key==='debt')list=ad.debt.map(x=>x.m);
  else list=[];
 }
 return list.filter(m=>m.phone);
}

function seedV3(o){
 const demo=m=>/^m\d+$/.test(m.id);
 if(!o.members.some(demo))return;
 const t=TODAY(),r=mulberry(20261020),rn=(a,b)=>a+Math.floor(r()*(b-a+1));
 o.members.forEach((m,i)=>{
  if(m.birth||!demo(m))return;
  const age=rn(19,44),md=parse(i===1?t:i===4?addDays(t,2):i===10?addDays(t,5):addDays(t,rn(8,355)));
  m.birth=(md.getFullYear()-age)+'-'+pad(md.getMonth()+1)+'-'+pad(Math.min(md.getDate(),md.getMonth()===1?28:31));
 });
 if(!o.daily.length){
  const dn=['عبدالرحمن الزهراني','نواف العتيبي','مشاعل الحربي','سعود القرني','وعد الشهري','إبراهيم الغامدي','رهف المالكي','أنس العمري','جواهر الدوسري','طلال السبيعي','لمى الرويلي','حسام بخاري'];
  const ph=dn.map(()=>'05'+String(10000000+rn(0,89999999))),now=new Date(),nowMin=now.getHours()*60+now.getMinutes(),price=o.settings.dailyPrice||40;
  for(let back=20;back>=0;back--){
   const d=addDays(t,-back),n=rn(0,3);
   for(let k=0;k<n;k++){
    const h=rn(7,22),mi=rn(0,59);if(back===0&&h*60+mi>nowMin)continue;
    const j=rn(0,dn.length-1),id=uid('d'),time=pad(h)+':'+pad(mi),meth=['cash','cash','card'][rn(0,2)];
    o.daily.push({id:id,name:dn[j],phone:ph[j],date:d,time:time,amount:price,method:meth,note:''});
    o.pay.push({id:uid('p'),kind:'daily',refId:id,subId:'',memberId:'',name:dn[j],date:d,amount:price,method:meth});
    o.att.push({id:uid('a'),memberId:'',dailyId:id,date:d,time:time});
   }
  }
 }
 if(!o.leads.length){
  const L=[['هيفاء الشمري','إنستقرام','p2','new',0,1],['مازن الحربي','زيارة للنادي','p1','contacted',-2,4],['أروى القحطاني','سناب شات','p3','trial',0,6],['فهد الرشيدي','توصية صديق','p1','contacted',1,3],['شوق العنزي','تيك توك','','new',-1,2],['ياسر الغامدي','اتصال','p4','won',null,20],['نوف السلمي','واتساب','p2','lost',null,15],['خليل الأنصاري','زيارة للنادي','p1','new',3,0]];
  const notes={contacted:'طلب تفاصيل الأسعار، يعاود التواصل',trial:'حجزت حصة تجريبية',won:'اشترك في الباقة',lost:'السعر غير مناسب حالياً'};
  L.forEach(x=>{
   const created=addDays(t,-x[5]),l={id:uid('l'),name:x[0],phone:'05'+String(10000000+rn(0,89999999)),source:x[1],planId:o.plans.some(p=>p.id===x[2])?x[2]:'',status:x[3],next:x[4]==null?'':addDays(t,x[4]),notes:'',created:created,log:[]};
   if(x[3]!=='new')l.log.push({date:addDays(created,1),note:notes[x[3]],st:x[3]});
   if(x[3]==='won')l.wonAt=addDays(created,2);
   o.leads.push(l);
  });
 }
 if(!o.cash.length){
  o.settings.openingCash=500;
  o.cash.push({id:uid('c'),date:addDays(t,-12),time:'09:10',type:'in',amount:200,note:'فكة للدرج'});
  o.cash.push({id:uid('c'),date:addDays(t,-6),time:'21:30',type:'out',amount:3000,note:'إيداع في حساب البنك'});
 }
}

/* birthdays */
function bdayInfo(m){
 if(!m||!m.birth)return null;
 const t=parse(TODAY()),b=parse(m.birth);
 let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());
 if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());
 return {days:Math.round((n-t)/864e5),age:n.getFullYear()-b.getFullYear(),date:ymd(n)};
}
const ageOf=m=>{const b=bdayInfo(m);return b?(b.days===0?b.age:b.age-1):null};
const bdayList=within=>S.members.map(m=>({m:m,b:bdayInfo(m)})).filter(x=>x.b&&x.b.days<=within).sort((a,b)=>a.b.days-b.b.days);

const NAV=[['الرئيسية',['dashboard']],['الأعضاء',['members','newmember','leads','subs','requests','schedule','portal']],['الدخول والحضور',['gate','checkin','daily']],['المالية',['cashbox','finance']],['التشغيل',['classes','trainers','trainer']],['التسويق',['marketing']],['التحليل',['reports','settings']]];
function shell(){
 $('#app').innerHTML='<div class="shell"><aside class="rail" aria-label="القائمة الرئيسية"><div class="brand"><span class="brandlogo" role="img" aria-label="جولة اللياقة"><i class="t"></i><i class="m"></i></span><small id="gymname"></small></div>'+(can('finance')?'<button type="button" class="inc" data-act="incomeModal" id="incR" aria-label="دخل اليوم، اعرض التفاصيل"></button>':'')+'<nav class="nav">'+NAV.map(g=>[g[0],g[1].filter(can)]).filter(g=>g[1].length).map(g=>'<p class="grp">'+g[0]+'</p>'+g[1].map(k=>'<a href="#'+k+'" data-p="'+k+'">'+ic(PAGES[k].icon)+'<span>'+PAGES[k].t+'</span>'+(k==='requests'?'<em class="badge" id="b-req" hidden></em>':'')+(k==='leads'?'<em class="badge" id="b-lead" hidden></em>':'')+'</a>').join('')).join('')+'</nav><div class="rfoot"><div class="mode" id="mode"></div><button type="button" class="btn sm" data-act="toggleTheme">'+ic('moon',15)+' تبديل المظهر</button><p id="syncst" class="sync" role="status"></p></div></aside><div class="scrim" data-act="closeMenu"></div><main class="main"><div class="top"><button type="button" class="ib" data-act="openMenu" aria-label="فتح القائمة">'+ic('menu',22)+'</button><b class="tt" id="ttl"></b>'+(can('finance')?'<button type="button" class="btn sm inc-t" data-act="incomeModal" id="incT" aria-label="دخل اليوم"></button>':'')+(can('checkin')?'<button type="button" class="btn sm pri" data-act="goCheckin">'+ic('checkin',15)+' حضور</button>':'')+'</div><div id="view"></div></main></div><div id="toast" role="status" aria-live="polite"></div>';
}
function render(){
 if(!PAGES[U.page])U.page='dashboard';
 const p=PAGES[U.page];
 $('#view').innerHTML=p.fn();
 $('#gymname').textContent='نظام إدارة النادي';$('#ttl').textContent=p.t;
 document.querySelectorAll('.nav a').forEach(a=>{if(a.dataset.p===U.page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 chrome();afterRender();
}
function route(){
 if(!SESS||!$('.shell'))return;
 const h=(location.hash||'#'+landing()).slice(1);
 U.page=PAGES[h]&&can(h)?h:landing();
 if(PAGES[h]&&!can(h)){try{history.replaceState(null,'','#'+landing())}catch(e){}}
 if(U.page!=='newmember'){U.nmDone='';U.nmTouched=false}
 $('.shell').classList.remove('open');
 render();window.scrollTo(0,0);
 if(U.page==='checkin'){const i=$('#ci');if(i)i.focus()}
}

document.addEventListener('click',e=>{
 const ov=e.target;if(ov.classList&&ov.classList.contains('ov')&&ov.id==='modal'){closeModal();return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const fn=ACT[b.dataset.act];if(fn){e.preventDefault();fn(b.dataset,b)}
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&IN[k])IN[k](e.target.value)});
document.addEventListener('submit',e=>{
 if(e.target.id==='cif'){e.preventDefault();const r=findMembers($('#ci').value);if(!r.length){toast('لم يُعثر على عضو مطابق');return}runCheckin(r[0])}
 if(e.target.id==='setf'){e.preventDefault();const f=e.target,s=S.settings;
  s.gym=f.gym.value.trim()||s.gym;s.pin=f.pin.value.trim()||s.pin;s.soonDays=Math.max(1,+f.soon.value||7);s.churnDays=Math.max(3,+f.churn.value||14);
  ['expiring','expired','away','debt','invoice','lead','bday'].forEach(k=>{s.tpl[k]=f['tpl_'+k].value});s.dailyPrice=Math.max(0,+f.dprice.value||0);s.openingCash=+f.opening.value||0;s.portalLink=f.link.value.trim();save();render();toast('تم حفظ الإعدادات')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal'))closeModal();else if($('.shell'))$('.shell').classList.remove('open')}});
window.addEventListener('hashchange',route);

try{const th=localStorage.getItem('nabd.theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
S=hydrate({});start();
})();
</script>

</body></html>
