  --f-display:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Readex Pro',system-ui,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(22,19,18,.04),0 12px 30px -16px rgba(22,19,18,.18); --edge:rgba(22,19,18,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0D0C; --surface:#171514; --surface-2:#1F1C1B; --ink:#EFECEA; --muted:#A39D98; --line:#2E2A28;
  --accent:#E5594F; --accent-ink:#1A0705; --accent-soft:#3A1916;
  --good:#4CC37E; --good-soft:#14301F; --warn:#E3B341; --warn-soft:#3A2E10; --bad:#F07A70; --bad-soft:#3E1A17; --info:#7FA9E6; --info-soft:#17283F;
  --rail:#0A0908; --rail-ink:#ECE8E5; --rail-muted:#8E8782; --rail-active:#26201E; --shadow:0 1px 0 rgba(255,255,255,.03),0 14px 30px -18px rgba(0,0,0,.8); --edge:#2A2624; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0D0C; --surface:#171514; --surface-2:#1F1C1B; --ink:#EFECEA; --muted:#A39D98; --line:#2E2A28;
  --accent:#E5594F; --accent-ink:#1A0705; --accent-soft:#3A1916;
  --good:#4CC37E; --good-soft:#14301F; --warn:#E3B341; --warn-soft:#3A2E10; --bad:#F07A70; --bad-soft:#3E1A17; --info:#7FA9E6; --info-soft:#17283F;
  --rail:#0A0908; --rail-ink:#ECE8E5; --rail-muted:#8E8782; --rail-active:#26201E; --shadow:0 1px 0 rgba(255,255,255,.03),0 14px 30px -18px rgba(0,0,0,.8); --edge:#2A2624; color-scheme:dark}

.brandlogo{--logo-ink:var(--ink);position:relative;display:block;aspect-ratio:936/312;height:44px;flex:none}
.brandlogo i{position:absolute;inset:0;display:block}
.brandlogo .t{background:var(--logo-ink);-webkit-mask:var(--logo-text) center/100% 100% no-repeat;mask:var(--logo-text) center/100% 100% no-repeat}
.brandlogo .m{background:var(--logo-mark) center/100% 100% no-repeat}
.brand .brandlogo{--logo-ink:var(--rail-ink);height:48px}
.lgb .brandlogo{height:62px}
.brand{flex-direction:column!important;align-items:flex-start!important;gap:6px!important}
.lgb{flex-direction:column!important;align-items:flex-start!important;gap:6px!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.num,td.num{font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:22px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{display:block;font:700 24px/1.1 var(--f-display)}
.brand small{display:block;color:var(--rail-muted);font-size:12px;line-height:1.3;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.grp{font-size:11.5px;color:var(--rail-muted);padding:14px 10px 5px;letter-spacing:.04em}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--rail-muted);text-decoration:none;font-weight:500}
.nav a:hover{color:var(--rail-ink);background:rgba(255,255,255,.05)}
.nav a[aria-current="page"]{background:var(--rail-active);color:#fff}
.rfoot{display:grid;gap:10px;padding:0 6px}
.rfoot p{font-size:11.5px;color:var(--rail-muted);line-height:1.6}
.rfoot .btn{background:transparent;color:var(--rail-ink);border-color:rgba(255,255,255,.16);justify-content:center}
.rfoot .btn:hover{background:rgba(255,255,255,.07)}

.main{--gut:28px;min-width:0;padding-block:22px 56px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.top{display:none}
.scrim{display:none}

.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:26px;font-weight:600;line-height:1.25}
.ph p{color:var(--muted);margin-top:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;line-height:1.25;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.bad{color:var(--bad)}
.btn.bad.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.ib{background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:inherit}
.ib:hover{background:var(--surface-2)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>header h2{font-size:15px;font-weight:600}
.pb{padding:16px}
.grid{display:grid;gap:16px;margin-top:16px}
.g2{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.g2b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.strip.s4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);padding:14px 16px;min-width:0}
.kpi span{display:block;color:var(--muted);font-size:12.5px}
.kpi b{display:block;font:600 26px/1.25 var(--f-display);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi b small{font-size:13px;font-weight:500;color:var(--muted)}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:1px}
.kpi.hot b{color:var(--bad)}
.kpi.good b{color:var(--good)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}

.tools{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tools input[type=search]{flex:1 1 220px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12.5px;font-weight:500}
.chip em{font-style:normal;color:var(--muted);margin-inline-start:3px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] em{color:inherit}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:12px;font-weight:500;color:var(--muted);padding:9px 14px;white-space:nowrap;background:var(--surface-2)}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:end}
tbody tr:hover td{background:var(--surface-2)}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
.link{background:none;border:0;padding:0;cursor:pointer;font-weight:600;text-align:start}
.link:hover{color:var(--accent)}
.cell-acts{display:flex;gap:6px;justify-content:flex-end}

.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow .link,.row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{display:block;color:var(--muted);font-size:12.5px}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 13px var(--f-display);flex:none}
.tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab em{font-style:normal;margin-inline-start:4px;font-size:12px}

function subSt(s){
 if(s.cancelled)return 'cancelled';
 if(s.noExpiry)return 'active';
 if(inFreeze(s))return 'frozen';
 const t=TODAY();
 if(s.end<t)return 'expired';
 if(s.start>t)return 'upcoming';
 return diff(s.end,t)<=S.settings.soonDays?'expiring':'active';
}
function mInfo(m){
 const t=TODAY(),subs=S.subs.filter(s=>s.memberId===m.id&&!s.cancelled&&s.kind!=='pt');
 if(!subs.length)return {st:'none',sub:null,end:null,days:0};
 const maxEnd=subs.reduce((a,s)=>s.end>a?s.end:a,'0');
 const fr=subs.some(inFreeze);
 const cov=subs.filter(s=>s.start<=t&&s.end>=t);
 let st;
 if(fr)st='frozen';
 else if(cov.length)st=diff(maxEnd,t)<=S.settings.soonDays?'expiring':'active';
 else if(subs.some(s=>s.start>t))st='upcoming';
 else st='expired';
 const byEnd=(a,b)=>b.end.localeCompare(a.end);
 const cur=(cov.length?cov.sort(byEnd):subs.sort(byEnd))[0];
 return {st:st,sub:cur,end:maxEnd,days:diff(maxEnd,t)};
}

function groupBars(labels,series,o){
 o=o||{};const W=640,H=o.H||190,pl=46,pr=8,pt=10,pb=24,iw=W-pl-pr,ih=H-pt-pb,every=o.every||1;
 const mx=niceMax(Math.max(1,Math.max.apply(null,series.reduce((a,s)=>a.concat(s.vals),[]))));
 const gw=iw/labels.length,bw=Math.min(28,gw*0.72/series.length);
 let g='';
 [0,0.5,1].forEach(f=>{const y=pt+ih-ih*f;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" class="gl"/><text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end" class="tx">'+num(mx*f)+'</text>'});
 labels.forEach((l,i)=>{
  const cx=pl+gw*i+gw/2;
  series.forEach((s,k)=>{const v=s.vals[i],h=ih*v/mx,x=cx-bw*series.length/2+bw*k;
   g+='<rect x="'+x.toFixed(1)+'" y="'+(pt+ih-h).toFixed(1)+'" width="'+Math.max(bw-1.5,1).toFixed(1)+'" height="'+Math.max(h,0).toFixed(1)+'" rx="2" class="'+s.cls+'"><title>'+esc(l)+' - '+s.name+': '+money(v)+'</title></rect>'});
  if(i%every===0)g+='<text x="'+cx.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" class="tx">'+esc(l)+'</text>';
 });
 return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="'+esc(o.label||'مخطط')+'">'+g+'</svg>';
}
function pulseChart(){
 const t=TODAY(),y=addDays(t,-1),nowH=new Date().getHours(),H0=5,H1=23;
 const cnt=d=>{const a=Array(H1-H0+1).fill(0);S.att.forEach(x=>{if(x.date===d){const h=+x.time.slice(0,2);if(h>=H0&&h<=H1)a[h-H0]++}});return a};
 const a=cnt(t),b=cnt(y),max=Math.max(4,Math.max.apply(null,a),Math.max.apply(null,b));
 const W=640,Ht=180,pl=30,pr=12,pt=14,pb=26,iw=W-pl-pr,ih=Ht-pt-pb;
 const X=i=>pl+iw*i/(a.length-1),Y=v=>pt+ih-ih*v/max;
 const nowIdx=Math.min(nowH,H1)-H0;
 const path=(arr,upto)=>arr.slice(0,upto+1).map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
 let g='';
 [0,0.5,1].forEach(f=>{const yy=pt+ih-ih*f;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" class="gl"/><text x="'+(pl-6)+'" y="'+(yy+4)+'" text-anchor="end" class="tx">'+num(max*f)+'</text>'});
 [6,9,12,15,18,21].forEach(h=>{g+='<text x="'+X(h-H0).toFixed(1)+'" y="'+(Ht-7)+'" text-anchor="middle" class="tx">'+fh(h)+'</text>'});
 g+='<path d="'+path(b,a.length-1)+'" class="ln2"/>';
 if(nowIdx>=0){
  g+='<path d="'+path(a,nowIdx)+' L'+X(nowIdx).toFixed(1)+' '+(pt+ih)+' L'+X(0).toFixed(1)+' '+(pt+ih)+'Z" class="area"/>';
  g+='<path d="'+path(a,nowIdx)+'" class="ln"/><circle cx="'+X(nowIdx).toFixed(1)+'" cy="'+Y(a[nowIdx]).toFixed(1)+'" r="5" class="dot"/>';
 }
 const todayN=a.reduce((x,v)=>x+v,0),yN=nowIdx>=0?b.slice(0,nowIdx+1).reduce((x,v)=>x+v,0):0,yAll=b.reduce((x,v)=>x+v,0);
 const peak=a.indexOf(Math.max.apply(null,a));
 return {svg:'<svg viewBox="0 0 '+W+' '+Ht+'" class="chart" role="img" aria-label="الحضور اليوم بالساعة مقارنة بالأمس">'+g+'</svg>',todayN:todayN,yN:yN,yAll:yAll,peak:todayN?fh(peak+H0):'—'};
}

function openModal(title,body,onSubmit,o){

 if(!$('#modal'))lastFocus=document.activeElement;else{const old=$('#modal');old.remove()}
 const ov=document.createElement('div');ov.className='ov';ov.id='modal';ov.dir='rtl';ov.lang='ar';
 const foot=o.noForm?'':'<footer><button type="submit" class="btn '+(o.danger?'bad solid':'pri')+'">'+(o.ok||'حفظ')+'</button><button type="button" class="btn" data-act="closeModal">إلغاء</button></footer>';

function drawQR(selector,m,size){
 const el=$(selector);if(!el)return;
 try{if(window.QRCode){el.innerHTML='';new QRCode(el,{text:qrPayload(m),width:size,height:size,colorDark:'#000000',colorLight:'#ffffff'})}else el.textContent=m.code}catch(e){el.textContent=m.code}
}
function decodeQrFile(file,cb){
 const rd=new FileReader();
 rd.onload=()=>{const img=new Image();
  img.onload=()=>{
   const sc=Math.min(1,1000/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc)),cv=document.createElement('canvas');
   cv.width=w;cv.height=h;
   let res=null;
   try{const cx=cv.getContext('2d');cx.drawImage(img,0,0,w,h);if(window.jsQR){const d=cx.getImageData(0,0,w,h);res=window.jsQR(d.data,d.width,d.height)}}catch(e){}
   cb(res?res.data:null)};
  img.onerror=()=>cb(null);img.src=rd.result};
 rd.onerror=()=>cb(null);rd.readAsDataURL(file);
}

function scheduleTable(m,ym,editable){

 const subs=S.subs.filter(s=>s.memberId===m.id&&!s.cancelled);

 const att=new Set(S.att.filter(a=>a.memberId===m.id).map(a=>a.date));
 let rows='';
 for(let k=1;k<=dim;k++){
  const d=ym+'-'+pad(k),dow=parse(d).getDay();
  const cls=S.classes.filter(c=>c.days.indexOf(dow)>=0).sort((a,b)=>a.time.localeCompare(b.time));
  const ins=inSub(d),fz=frz(d),can=editable&&ins&&!fz&&d>=t;
  const chips=cls.map(c=>{
   const on=S.book.some(b=>b.classId===c.id&&b.date===d&&b.memberId===m.id),full=!on&&bookedCount(c.id,d)>=c.cap,tr=trainerById(c.trainerId);

function wChart(log){

 const X=i=>pl+iw*i/(log.length-1),Y=v=>pt+ih-ih*(v-mn)/(mx-mn);
 let g='';
 [mn,(mn+mx)/2,mx].forEach(v=>{const y=Y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" class="gl"/><text x="'+(pl-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="tx">'+num(v)+'</text>'});
 g+='<path class="ln" d="'+log.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x.weight).toFixed(1)).join('')+'"/>';
 log.forEach((x,i)=>{g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(x.weight).toFixed(1)+'" r="3.5" class="dot"><title>'+fdate(x.date)+': '+x.weight+' كغ</title></circle>'});
 g+='<text x="'+pl+'" y="'+(H-6)+'" class="tx" text-anchor="start">'+fdate(log[0].date,{day:'numeric',month:'short'})+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" class="tx" text-anchor="end">'+fdate(log[log.length-1].date,{day:'numeric',month:'short'})+'</text>';
 return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="منحنى الوزن">'+g+'</svg>';
}

async function api(path,opt){
 opt=opt||{};
 let r;
 try{r=await fetch('/api/'+path,{method:opt.method||'GET',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'gym'},body:opt.body?JSON.stringify(opt.body):undefined})}
 catch(e){const err=new Error('تعذّر الاتصال بالخادم');err.status=0;throw err}
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok){const err=new Error((j&&j.error)||('خطأ '+r.status));err.status=r.status;throw err}
 return j;
}
const clone=o=>JSON.parse(JSON.stringify(o));
function hydrate(raw){
 raw=raw||{};const o=Object.assign(wipeState(),clone(raw));
 o.settings=Object.assign(wipeState().settings,raw.settings||{});
 o.settings.tpl=Object.assign({},DEFAULT_TPL,(raw.settings&&raw.settings.tpl)||{});
 SYNC_COLS.forEach(c=>{if(!Array.isArray(o[c]))o[c]=[]});
 if(raw.trainerSelf&&raw.trainerSelf.id){const t=o.trainers.find(x=>x.id===raw.trainerSelf.id);if(t)Object.assign(t,{avail:raw.trainerSelf.avail||[],leaves:raw.trainerSelf.leaves||[]})}delete o.trainerSelf;
 if(!raw.plans&&isManager())o.plans=basePlans();
 if(!raw.ptPlans&&isManager())o.ptPlans=[{id:'pp1',name:'جلسة تعريفية',sessions:1,validDays:14,price:99,dur:60,intro:true},{id:'pp2',name:'8 جلسات',sessions:8,validDays:45,price:1200,dur:60,intro:false},{id:'pp3',name:'12 جلسة',sessions:12,validDays:90,price:1650,dur:60,intro:false},{id:'pp4',name:'20 جلسة',sessions:20,validDays:0,price:2600,dur:60,intro:false}];
 o.nextCode=Math.max(raw.nextCode||1001,o.members.reduce((a,m)=>Math.max(a,(parseInt(String(m.code).replace(/\D/g,''),10)||0)+1),1001));
 o.nextInv=Math.max(raw.nextInv||1,o.subs.reduce((a,s)=>Math.max(a,(parseInt(String(s.inv).replace(/\D/g,''),10)||0)+1),1));
 o.nextCn=Math.max(raw.nextCn||1,o.pay.reduce((a,p)=>Math.max(a,(parseInt(String(p.cn||'').replace(/\D/g,''),10)||0)+1),1));
 o.v=1;o.v2=1;o.v3=1;
 return o;
}
const Sync=(function(){
 let BASE=null,rev=0,timer=null,busy=false,again=false,state='ok',pollT=null,pending=false;
 function setStatus(k){state=k;const el=$('#syncst');if(!el)return;
  const t={ok:'متصل · كل التغييرات محفوظة',saving:'جارٍ الحفظ…',pending:'جارٍ الحفظ…',off:'غير متصل · سيُحفظ عند عودة الاتصال',err:'تعذّر حفظ آخر تغيير'}[k];
  el.textContent=t;el.className='sync '+k}
 function diff(){
  const ops=[];if(!BASE)return ops;
  SYNC_COLS.forEach(c=>{
   const a=BASE[c]||[],b=S[c]||[],am=new Map(a.map(x=>[x.id,x])),seen=new Set();
   b.forEach(x=>{if(!x||!x.id)return;seen.add(x.id);const o=am.get(x.id);if(!o&&STAMP_COLS.indexOf(c)>=0&&!x.by&&SESS){x.by=SESS.key;x.byName=SESS.name;x.at=new Date().toISOString()}if(!o||JSON.stringify(o)!==JSON.stringify(x))ops.push({c:c,op:'put',v:x})});
   a.forEach(x=>{if(x&&x.id&&!seen.has(x.id))ops.push({c:c,op:'del',id:x.id})});
  });
  if(isManager()&&JSON.stringify(BASE.settings)!==JSON.stringify(S.settings))ops.push({c:'settings',op:'set',v:S.settings});
  if(isOffice())['nextCode','nextInv','nextCn'].forEach(k=>{if((S[k]||0)>(BASE[k]||0))ops.push({c:'meta',op:'max',k:k,v:S[k]})});
  return ops;
 }
 function adopt(raw,r){
  S=hydrate(raw);BASE=clone(S);
  if(isManager()){if(!raw.plans)BASE.plans=[];if(!raw.ptPlans)BASE.ptPlans=[];if(!raw.settings)BASE.settings={}}
  rev=r;
 }
 async function load(){const j=await api('state');U.warn=j.warn||'';adopt(j.state,j.rev);if(diff().length)queue()}
 function queue(){pending=true;setStatus('pending');clearTimeout(timer);timer=setTimeout(flush,350)}
 async function flush(){
  clearTimeout(timer);
  if(busy){again=true;return}
  const ops=diff();
  if(!ops.length){pending=false;setStatus('ok');return}
  busy=true;setStatus('saving');
  const snap=clone(S);
  try{
   const r=await api('sync',{method:'POST',body:{ops:ops}});
   BASE=snap;rev=r.rev;pending=false;
   let changed=false;
   Object.keys(r.remap&&r.remap.members||{}).forEach(id=>{const v=r.remap.members[id];[S,BASE].forEach(o=>{const m=o.members.find(x=>x.id===id);if(m)m.code=v});changed=true});
   Object.keys(r.remap&&r.remap.subs||{}).forEach(id=>{const v=r.remap.subs[id];[S,BASE].forEach(o=>{const s=o.subs.find(x=>x.id===id);if(s)s.inv=v});changed=true});
   if(changed)safeRender();
   setStatus('ok');
  }catch(e){
   if(e.status===401){toast('انتهت الجلسة، سجّل الدخول مرة أخرى');setTimeout(()=>location.reload(),1200);return}
   if(e.status===0||e.status>=500||e.status===429){setStatus('off');setTimeout(flush,5000)}
   else{setStatus('err');toast('لم يُحفظ التغيير: '+e.message);try{await load();safeRender()}catch(x){}}
  }finally{busy=false;if(again){again=false;flush()}}
 }
 function safeRender(){
  if(!SESS||!$('.shell'))return;
  const a=document.activeElement,inView=a&&a.closest&&a.closest('#view')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName),typing=inView&&(a.tagName!=='INPUT'||a.value);
  if($('#modal')||typing){setTimeout(safeRender,2500);return}
  const y=window.scrollY,fid=inView&&a.id;render();window.scrollTo(0,y);
  if(fid){const f=document.getElementById(fid);if(f)f.focus()}
 }
 function applyChanges(list){
  list.forEach(e=>{
   [S,BASE].forEach(o=>{
    if(e.c==='settings'){o.settings=Object.assign({},o.settings,clone(e.v));return}
    const arr=o[e.c]||(o[e.c]=[]),i=arr.findIndex(x=>x.id===(e.op==='put'?e.v.id:e.id));
    if(e.op==='put'){if(i>=0)arr[i]=clone(e.v);else arr.push(clone(e.v))}else if(i>=0)arr.splice(i,1);
   });
  });
 }
 async function poll(){
  if(busy||pending||document.hidden)return;
  try{
   const r=await api('rev');setStatus('ok');
   if(r.rev===rev||diff().length)return;
   if(isStaff()){
    const c=await api('changes?since='+rev);
    if(diff().length)return;
    if(c.full){await load()}else{applyChanges(c.changes);rev=c.rev}
   }else await load();
   safeRender();
  }catch(e){if(e.status===401){location.reload();return}setStatus('off')}
 }
 function startPolling(){clearInterval(pollT);pollT=setInterval(poll,8000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()})}
 window.addEventListener('beforeunload',e=>{if(pending||busy){e.preventDefault();e.returnValue=''}});
 return {load:load,queue:queue,flush:flush,startPolling:startPolling,status:()=>setStatus(state),reset:()=>{BASE=null;rev=0;clearInterval(pollT)}};
})();

function segMembers(key){
 const t=TODAY();let list;
 if(key.indexOf('plan:')===0){const id=key.slice(5);list=S.members.filter(m=>{const i=mInfo(m);return i.sub&&i.sub.planId===id&&(i.st==='active'||i.st==='expiring')})}
 else if(key.indexOf('trainer:')===0){const id=key.slice(8);list=S.members.filter(m=>m.trainerId===id)}
 else{
  const ad=attnData();
  if(key==='all')list=S.members.slice();
  else if(key==='active')list=S.members.filter(m=>{const s=mInfo(m).st;return s==='active'||s==='expiring'});
  else if(key==='expiring')list=ad.expiring.map(x=>x.m);
  else if(key==='expired')list=S.members.filter(m=>mInfo(m).st==='expired');
  else if(key==='away')list=ad.away.map(x=>x.m);
  else if(key==='new30')list=S.members.filter(m=>m.joined>=addDays(t,-30));
  else if(key==='none')list=S.members.filter(m=>mInfo(m).st==='none');
  else if(key==='debt')list=ad.debt.map(x=>x.m);
  else list=[];
 }
 return list.filter(m=>m.phone);
}

/* birthdays */
function bdayInfo(m){
 if(!m||!m.birth)return null;
 const t=parse(TODAY()),b=parse(m.birth);
 let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());
 if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());
 return {days:Math.round((n-t)/864e5),age:n.getFullYear()-b.getFullYear(),date:ymd(n)};
}
const ageOf=m=>{const b=bdayInfo(m);return b?(b.days===0?b.age:b.age-1):null};
const bdayList=within=>S.members.map(m=>({m:m,b:bdayInfo(m)})).filter(x=>x.b&&x.b.days<=within).sort((a,b)=>a.b.days-b.b.days);
const bdayMsg=m=>{const b=bdayInfo(m);return b&&b.days===0?'<p class="bdm">'+ic('cake',16)+' اليوم عيد ميلاده، يكمل '+b.age+' سنة. هنّئه!</p>':''};

/* installments: payments beyond the up-front part cover installments in date order */
function instStatus(s){
 if(!s||!s.inst||!s.inst.length||s.cancelled)return [];
 const sum=s.inst.reduce((a,x)=>a+x.amount,0);let rem=paidOf(s.id)-(s.total-sum);const t=TODAY();
 return s.inst.map((x,i)=>{const cov=Math.max(0,Math.min(x.amount,rem));rem-=x.amount;
  const st=cov>=x.amount-0.001?'paid':x.due<t?'late':diff(x.due,t)<=7?'soon':'later';
  return {n:i+1,due:x.due,amount:x.amount,paid:cov,st:st}});
}
const INST_ST={paid:['مسدد','good'],late:['متأخر','bad'],soon:['يستحق قريباً','warn'],later:['قادم','']};
function addMonths(d,k){const x=parse(d);const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+k);const dim=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,dim));return ymd(x)}
function makeInst(total,upfront,n,start){
 const rem=Math.round((total-upfront)*100)/100;if(n<2||rem<=0)return null;
 const base=Math.floor(rem/n*100)/100,out=[];let acc=0;
 for(let i=0;i<n;i++){const a=i===n-1?Math.round((rem-acc)*100)/100:base;acc+=a;out.push({due:addMonths(start,i+1),amount:a})}
 return out;
}

/* ===== personal training: data helpers ===== */
const PT_ST={booked:['محجوزة','info'],done:['حضر','good'],noshow:['لم يحضر','bad'],late_cancel:['إلغاء متأخر','warn'],cancelled:['أُلغيت ضمن المهلة',''],club_cancel:['أُلغيت من النادي','info']};
const PACK_ST={active:['سارية','good'],low:['قاربت على الانتهاء','warn'],used:['استُهلكت',''],expired:['انتهت صلاحيتها','bad'],cancelled:['ملغاة','']};
const ptPlanById=id=>(S.ptPlans||[]).find(x=>x.id===id);
const packById=id=>(S.ptPacks||[]).find(x=>x.id===id);
const packSessions=k=>(S.ptSess||[]).filter(x=>x.packId===k.id);
const packUsed=k=>packSessions(k).filter(x=>x.charged).reduce((a,x)=>a+(+x.units||1),0)+(k.adj||[]).filter(a=>+a.n>0).reduce((a,x)=>a+(+x.n),0);
const packBooked=k=>packSessions(k).filter(x=>x.status==='booked').length;
const packLeft=k=>Math.max(0,packTotal(k)-packUsed(k));
function packState(k){
 const sub=S.subs.find(s=>s.id===k.subId);
 if(k.status==='cancelled'||(sub&&sub.cancelled))return 'cancelled';
 if(packLeft(k)<=0)return 'used';
 if(k.expires<TODAY())return 'expired';
 if(packLeft(k)<=2||diff(k.expires,TODAY())<=7)return 'low';
 return 'active';
}
const packOpen=k=>{const st=packState(k);return st==='active'||st==='low'};
const mins=t=>{const a=String(t||'0:0').split(':');return (+a[0]||0)*60+(+a[1]||0)};
const hhmm=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const sessStart=x=>new Date(x.date+'T'+x.time+':00');
const hoursAway=x=>(sessStart(x)-Date.now())/36e5;
function chargeFor(status){const s=S.settings;return status==='done'?true:status==='noshow'?s.ptNoShowCharge!==false:status==='late_cancel'?s.ptLateCharge!==false:false}
const ptProfile=mid=>S.pt.find(p=>p.memberId===mid);
const myTrainerScope=()=>SESS.role==='trainer'?SESS.uid:'';

/* free slots for a trainer on a date */
function trainerSlots(tid,date,dur,ignoreId,memberId){
 const t=trainerById(tid);if(!t)return [];
 const dow=parse(date).getDay(),wins=(t.avail||[]).filter(a=>+a.d===dow);
 const busy=[];
 (S.ptSess||[]).forEach(x=>{if(x.id!==ignoreId&&x.date===date&&(x.status==='booked'||x.status==='done')&&(x.trainerId===tid||(memberId&&x.memberId===memberId)))busy.push([mins(x.time),mins(x.time)+(+x.dur||60)])});
 S.classes.forEach(c=>{if(c.trainerId===tid&&c.days.indexOf(dow)>=0)busy.push([mins(c.time),mins(c.time)+(+c.dur||60)])});
 const now=new Date(),nowMin=date===TODAY()?now.getHours()*60+now.getMinutes():-1,out=[];
 wins.forEach(w=>{for(let a=mins(w.from);a+dur<=mins(w.to);a+=30){if(a<=nowMin)continue;if(busy.some(b=>a<b[1]&&b[0]<a+dur))continue;out.push(hhmm(a))}});
 return [...new Set(out)].sort();
}
function clashFor(v){
 const a0=mins(v.time),a1=a0+(+v.dur||60);
 return (S.ptSess||[]).find(x=>x.id!==v.id&&x.date===v.date&&(x.status==='booked'||x.status==='done')&&(x.trainerId===v.trainerId||x.memberId===v.memberId)&&mins(x.time)<a1&&a0<mins(x.time)+(+x.dur||60));
}

/* ===== commissions + PT indicators (manager) ===== */
function ptCommission(ym){
 const set=S.settings,type=set.ptCommType||'percent',val=+set.ptCommValue||0,pen=!!set.ptCommPenalty;
 const rows={};
 (S.ptSess||[]).forEach(x=>{
  if(!x.date.startsWith(ym)||!x.charged||x.kind==='class')return;if(x.status!=='done'&&!pen)return;
  const k=packById(x.packId);if(!k)return;const per=(+k.sessions?packValue(k)/k.sessions:0),c=type==='percent'?per*val/100:val;
  const r=rows[x.trainerId]=rows[x.trainerId]||{n:0,done:0,value:0,comm:0};r.n++;if(x.status==='done')r.done++;r.value+=per;r.comm+=(type==='percent'||packValue(k)>0)?c:0;
 });
 return rows;
}
function ptKpis(){
 const t=TODAY(),from=addDays(t,-90),P=S.ptPacks||[];
 const intros=P.filter(k=>k.intro&&k.start>=from),conv=intros.filter(k=>P.some(o=>o.memberId===k.memberId&&!o.intro&&o.start>=k.start&&o.id!==k.id));
 const ended=P.filter(k=>!k.intro&&['used','expired'].indexOf(packState(k))>=0&&k.start>=addDays(t,-180)),ren=ended.filter(k=>P.some(o=>o.memberId===k.memberId&&o.id!==k.id&&o.start>=k.start&&!o.intro));
 const util=S.trainers.map(tr=>{let av=0,bk=0;for(let i=0;i<7;i++){const d=addDays(t,i),dow=parse(d).getDay();(tr.avail||[]).filter(a=>+a.d===dow).forEach(a=>av+=mins(a.to)-mins(a.from));(S.ptSess||[]).filter(x=>x.trainerId===tr.id&&x.date===d&&(x.status==='booked'||x.status==='done')).forEach(x=>bk+=+x.dur||60)}return {tr:tr,av:av,bk:bk,pc:av?Math.round(bk/av*100):null}});
 const mk=t.slice(0,7),sold=P.filter(k=>k.start.startsWith(mk)),done=(S.ptSess||[]).filter(x=>x.date.startsWith(mk)&&x.status==='done').length;
 return {intros:intros.length,conv:conv.length,ended:ended.length,ren:ren.length,util:util,sold:sold.length,soldVal:sold.reduce((a,k)=>a+packValue(k),0),done:done};
}

function wrapLines(x,text,maxW){

}

function resizeImage(file,max){
 return new Promise((res,rej)=>{
  const fr=new FileReader();fr.onerror=()=>rej(new Error('تعذّرت قراءة الصورة'));
  fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('الملف ليس صورة صالحة'));im.onload=()=>{
   const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),cv=document.createElement('canvas');cv.width=w;cv.height=h;
   const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);res(cv.toDataURL('image/jpeg',.85))};im.src=fr.result};
  fr.readAsDataURL(file);
 });
}

/* ---------- v8: session-credit packages (reserve, deduct, release, renew, ledger) + Word import of classes ---------- */
const PT_FMT={single:'فردية',pair:'ثنائية',group:'مجموعة صغيرة'};
const PT_SERVICES=['تدريب شخصي','فنون قتالية','ملاكمة','كيك بوكسينغ','لياقة وظيفية','تمارين القوة','يوغا وإطالة','تأهيل حركي'];
const fmtN=n=>{n=Math.round((+n||0)*2)/2;return Number.isInteger(n)?String(n):n.toFixed(1)};
const sessUnits=x=>x.charged?(+x.units||1):0;
const packTopups=k=>(k.topups||[]).reduce((a,t)=>a+(+t.n||0),0);
const adjAdd=k=>(k.adj||[]).filter(a=>+a.n<0).reduce((s,a)=>s-(+a.n),0);
const adjSub=k=>(k.adj||[]).filter(a=>+a.n>0).reduce((s,a)=>s+(+a.n),0);
const packTotal=k=>(+k.sessions||0)+packTopups(k)+adjAdd(k);
const packDone=k=>packSessions(k).filter(x=>x.status==='done').reduce((a,x)=>a+sessUnits(x),0);
const packPenal=k=>packSessions(k).filter(x=>x.status!=='done').reduce((a,x)=>a+sessUnits(x),0);
const packAvail=k=>Math.max(0,packLeft(k)-packBooked(k));
const packExpTxt=k=>k.expires?'صالحة حتى '+fdate(k.expires):'بدون مدة انتهاء';
const planLabel=p=>p.name+' · '+p.sessions+' جلسة · '+(+p.validDays?'خلال '+p.validDays+' يوماً':'بدون انتهاء')+' · '+(p.useFor==='classes'?'حضور حصص':PT_FMT[p.fmt||'single'])+' · '+num(p.price)+' ر.س';
function packState(k){
 const sub=S.subs.find(s=>s.id===k.subId);
 if(k.status==='cancelled'||(sub&&sub.cancelled))return 'cancelled';
 if(packLeft(k)<=0)return 'used';
 if(k.expires&&k.expires<TODAY())return 'expired';
 if(packAvail(k)<=2||(k.expires&&diff(k.expires,TODAY())<=7))return 'low';
 return 'active';
}
/* the balance shown everywhere: total = done + penalties + booked + available */
function packBreak(k,big){
 const tot=packTotal(k),done=packDone(k),pen=packPenal(k)+adjSub(k),bk=packBooked(k),av=packAvail(k);
 const seg=(n,c)=>n>0?'<i class="'+c+'" style="width:'+(n/Math.max(1,tot)*100)+'%"></i>':'';
 return '<div class="pkb'+(big?' big':'')+'"><div class="pkb-bar" role="img" aria-label="'+fmtN(tot)+' إجمالي، '+fmtN(done)+' منفذة، '+fmtN(bk)+' محجوزة، '+fmtN(av)+' متاحة">'+seg(done,'d')+seg(pen,'p')+seg(bk,'b')+'</div>'+
  '<div class="pkb-eq"><span><b>'+fmtN(tot)+'</b> إجمالي</span><em>=</em><span class="d"><b>'+fmtN(done)+'</b> منفذة</span>'+(pen?'<em>+</em><span class="p"><b>'+fmtN(pen)+'</b> مخصومة</span>':'')+'<em>+</em><span class="b"><b>'+bk+'</b> محجوزة</span><em>+</em><span class="a"><b>'+fmtN(av)+'</b> متاحة</span></div></div>';
}
const packValue=k=>k.uv!=null&&SESS&&SESS.role==='trainer'?k.uv*((+k.sessions||0)+packTopups(k)):S.subs.filter(s=>s.kind==='pt'&&(s.packId===k.id||s.id===k.subId)).reduce((a,s)=>a+Math.max(0,s.cancelled?paidOf(s.id):s.total),0);
function ptCommission(ym){
 const set=S.settings,type=set.ptCommType||'percent',val=+set.ptCommValue||0,pen=!!set.ptCommPenalty,rows={};
 (S.ptSess||[]).forEach(x=>{
  if(!x.date.startsWith(ym)||!x.charged||x.kind==='class')return;if(x.status!=='done'&&!pen)return;
  const k=packById(x.packId);if(!k)return;const paidN=(+k.sessions||0)+packTopups(k),u=+x.units||1,per=(paidN?packValue(k)/paidN:0)*u,c=type==='percent'?per*val/100:val*u;
  const r=rows[x.trainerId]=rows[x.trainerId]||{n:0,done:0,value:0,comm:0};r.n+=u;if(x.status==='done')r.done+=u;r.value+=per;r.comm+=(type==='percent'||packValue(k)>0)?c:0;
 });
 return rows;
}

/* full movement log of a package */
function packLedger(k){
 const L=[],tm=s=>s||'',who=s=>s?' · '+esc(s):'';
 const sub=S.subs.find(s=>s.id===k.subId);
 L.push({t:(k.start||'')+'T00:00',lbl:'شراء الباقة',d:esc(k.name)+(sub?' · '+sub.inv:'')+who(sub&&sub.byName),eff:'+'+fmtN(k.sessions),c:'good'});
 (k.topups||[]).forEach(x=>{const s=S.subs.find(z=>z.id===x.subId);L.push({t:x.at,lbl:x.subId?'إضافة رصيد':'إضافة رصيد يدوية',d:(s?s.inv:'')+(x.ext?' · تمديد '+x.ext+' يوماً':'')+(x.reason?' · '+esc(x.reason):'')+who(x.by),eff:'+'+fmtN(x.n),c:'good'})});
 (k.adj||[]).forEach(a=>L.push({t:a.at,lbl:+a.n<0?'إضافة يدوية':'خصم يدوي',d:esc(a.reason||'')+who(a.by),eff:(+a.n<0?'+':'−')+fmtN(Math.abs(+a.n)),c:+a.n<0?'good':'bad'}));
 (k.expLog||[]).forEach(a=>L.push({t:a.at,lbl:'تعديل الصلاحية',d:(a.from?fdate(a.from):'بدون انتهاء')+' ← '+(a.to?fdate(a.to):'بدون انتهاء')+' · '+esc(a.reason||'')+who(a.by),eff:'',c:''}));
 packSessions(k).forEach(x=>{
  const when=dayLabel(x.date)+' '+ft(x.time)+(x.kind==='class'?' · حصة '+((S.classes.find(c=>c.id===x.classId)||{}).name||''):''),tr=(trainerById(x.trainerId)||{}).name||'';
  L.push({t:x.at||x.date+'T00:00',lbl:'حجز موعد',d:when+' · '+esc(tr)+who(x.byName),eff:'حجز مؤقت',c:'info'});
  (x.resched||[]).forEach(r=>L.push({t:r.at,lbl:'إعادة جدولة',d:dayLabel(r.from.date)+' '+ft(r.from.time)+' ← '+dayLabel(r.to.date)+' '+ft(r.to.time)+(r.why?' · '+esc(r.why):'')+who(r.by),eff:'دون خصم',c:''}));
  const u=fmtN(+x.units||1),at=x.docAt||x.cancelledAt||x.date+'T'+x.time;
  if(x.status==='done')L.push({t:at,lbl:'تنفيذ الجلسة',d:when+who(x.docBy),eff:x.charged?'−'+u:'0',c:'bad'});
  if(x.status==='noshow')L.push({t:at,lbl:'عدم حضور',d:when+who(x.docBy),eff:x.charged?'−'+u:'أُعيدت',c:x.charged?'bad':''});
  if(x.status==='late_cancel')L.push({t:at,lbl:'إلغاء متأخر',d:when+(x.adjReason?' · '+esc(x.adjReason):'')+who(x.cancelledBy),eff:x.charged?'−'+u:'أُعيدت',c:x.charged?'bad':''});
  if(x.status==='cancelled')L.push({t:at,lbl:'إلغاء ضمن المهلة',d:when+who(x.cancelledBy),eff:'أُعيدت للمتاح',c:''});
  if(x.status==='club_cancel')L.push({t:at,lbl:'إلغاء من النادي أو المدربة',d:when+(x.adjReason?' · '+esc(x.adjReason):'')+who(x.cancelledBy),eff:'أُعيدت دون خصم',c:''});
 });
 return L.sort((a,b)=>tm(b.t).localeCompare(tm(a.t)));
}

}

function readRun(){
 const ex=[];for(let i=0;i<12;i++){const n=$('#rx-n'+i);if(!n)break;const v=n.value.trim();if(v)ex.push({name:v,sets:$('#rx-s'+i).value.trim(),reps:$('#rx-r'+i).value.trim(),weight:$('#rx-w'+i).value.trim()})}
 const g=id=>{const e=$(id);return e?e.value:''};
 return {ex:ex,perf:g('#rx-perf'),note:g('#rx-note').trim(),units:g('#rx-units'),day:g('#rx-day')};
}
function runStep(id,k){
 const x=(S.ptSess||[]).find(s=>s.id===id);if(!x)return;const r=readRun(),pk=packById(x.packId);
 if(r.day)x.planDay=r.day;
 if(k==='in'){x.checkinAt=nowIso();save();render();ptRunModal(id,'سُجّل حضور المتدربة');return}
 if(k==='run'){x.startAt=nowIso();x.checkinAt=x.checkinAt||x.startAt;save();render();ptRunModal(id);return}
 if(k==='noshow'){confirmModal('تسجيل الغياب','سيُسجَّل غياب المتدربة'+(chargeFor('noshow')?' وتُخصم الجلسة حسب سياسة النادي.':' دون خصم حسب سياسة النادي.'),'تسجيل الغياب',()=>{x.status='noshow';x.charged=chargeFor('noshow');x.units=1;x.docAt=nowIso();x.docBy=SESS.name;save();render();toast('سُجّل الغياب'+(x.charged?' وخُصمت الجلسة':''))},true);return}
 if(k==='save'){x.exercises=r.ex;x.perf=r.perf?+r.perf:null;x.note=r.note;x.editAt=nowIso();save();render();ptRunModal(id,'حُفظ الأداء');return}
 if(k==='end'){
  if(x.status!=='booked'){toast('الجلسة منتهية مسبقاً، ولا تُخصم مرتين');return}
  const u=pk&&pk.half&&r.units==='0.5'?0.5:1;
  x.exercises=r.ex;x.perf=r.perf?+r.perf:null;x.note=r.note;x.status='done';x.charged=true;x.units=u;x.endAt=nowIso();x.docAt=x.endAt;x.docBy=SESS.name;
  save();render();
  const left=pk?packLeft(pk):0,bk=pk?packBooked(pk):0;
  ptRunModal(id,'تم تسجيل الجلسة وخصم '+(u===0.5?'نصف جلسة':'جلسة واحدة')+'؛ المتبقي '+fmtN(left)+' '+(left===1?'جلسة':'جلسات')+(bk?' (منها '+bk+' محجوزة)':''));
 }
}

function postSave(status){

 if(x.pubDate){if(!old||!old.pubAt||toLocalDate(old.pubAt)!==x.pubDate)x.pubAt=x.pubDate===TODAY()?nowIso():new Date(x.pubDate+'T08:00:00').toISOString();else x.pubAt=old.pubAt}else x.pubAt='';

 x.read=Math.max(1,Math.round(x.blocks.reduce((a,b)=>a+String(b.v||'').split(/\s+/).filter(Boolean).length,0)/180));
 S.posts=S.posts||[];const i=S.posts.findIndex(y=>y.id===x.id);if(i>=0)S.posts[i]=x;else S.posts.push(x);

}

async function readXlsx(file){
 const buf=await file.arrayBuffer();
 let ss=[];try{const x=await unzipEntry(buf,'xl/sharedStrings.xml'),d=new DOMParser().parseFromString(x,'application/xml');ss=[...d.getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join(''))}catch(e){}
 let sx;try{sx=await unzipEntry(buf,'xl/worksheets/sheet1.xml')}catch(e){throw new Error('الملف ليس ملف Excel صالحاً (.xlsx)')}
 const d=new DOMParser().parseFromString(sx,'application/xml'),rows=[];
 const colN=ref=>{const m=/^([A-Z]+)/.exec(ref||'');let n=0;if(m)for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1};
 [...d.getElementsByTagName('row')].forEach(r=>{const out=[];[...r.getElementsByTagName('c')].forEach(c=>{const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0],i=colN(c.getAttribute('r'));let val=null;
   if(t==='s'&&v)val=ss[+v.textContent];else if(t==='inlineStr'){val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('')}else if(v){val=t==='str'||t==='b'?v.textContent:+v.textContent}
   if(i>=0)out[i]=val});rows.push(out)});
 return rows;
}

 const s=impTxt(v).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));let m;
 if((m=/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(s)))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
 if((m=/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/.exec(s)))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');

function schedApply(R,month,from){
 const t=TODAY(),progs=[...new Set(R.map(r=>r.prog))],mk=r=>({id:uid('c'),prog:r.prog,name:r.name,days:r.days.slice().sort(),time:r.time,dur:r.dur,cap:r.prog==='martial'?20:15,trainerId:r.trainerId||'',lvl:r.lvl||'',clr:r.clr||'',month:month});
 if(from>t){S.settings.schedPending=Object.assign({},S.settings.schedPending||{});progs.forEach(p=>{S.settings.schedPending[p]={month:month,from:from,classes:R.filter(r=>r.prog===p).map(mk)}});
  toast('سيُطبَّق جدول '+monthLabel(month)+' تلقائياً في '+fdate(from));return}
 progs.forEach(p=>{const old=S.classes.filter(c=>progOf(c)===p),keep=new Set();
  const neu=R.filter(r=>r.prog===p).map(r=>{const o=old.find(c=>!keep.has(c.id)&&c.name===r.name&&c.time===r.time&&(+c.dur||60)===r.dur);const v=mk(r);if(o){keep.add(o.id);v.id=o.id;v.cap=o.cap||v.cap}return v});
  const gone=new Set(old.filter(c=>!keep.has(c.id)).map(c=>c.id));
  S.book=S.book.filter(b=>!(gone.has(b.classId)&&b.date>=from));
  S.classes=S.classes.filter(c=>progOf(c)!==p).concat(neu);
  if(S.settings.schedPending&&S.settings.schedPending[p]){S.settings.schedPending=Object.assign({},S.settings.schedPending);delete S.settings.schedPending[p]}});
 toast('اعتُمد جدول '+monthLabel(month)+' · '+R.reduce((a,r)=>a+r.days.length,0)+' حصة أسبوعياً');
}

 openModal(full?'الكلاس مكتمل':'حجز الكلاس','<div class="fm"><div class="full bk-q"><b>'+esc(c.name)+'</b><span>'+dayLabel(d.k)+' · '+ft(c.time)+' · '+(+c.dur||60)+' دقيقة</span></div><p class="full">'+(full?'اكتملت المقاعد. هل ترغبين بالانضمام لقائمة الانتظار؟ تنتقلين تلقائياً عند توفر مقعد.':'هل ترغبين بحجز هذا الكلاس؟')+'</p></div>',
  ()=>{_hmBook28(d,el)},{ok:full?'انضمام للانتظار':'تأكيد الحجز',noFocus:true});
};

/* ---------- shell + router ---------- */
const PAGES={
 dashboard:{t:'لوحة التحكم',icon:'dash',fn:pageDashboard2},members:{t:'الأعضاء',icon:'members',fn:pageMembers},subs:{t:'الاشتراكات',icon:'subs',fn:pageSubs},checkin:{t:'الحضور',icon:'checkin',fn:pageCheckin},
 finance:{t:'المالية',icon:'finance',fn:pageFinance2},shift:{t:'إغلاق الوردية',icon:'shift',fn:pageShift},pt:{t:'التدريب الشخصي',icon:'dumbbell',fn:pagePT},home:{t:'الرئيسية',icon:'home',fn:()=>isPhone()&&SESS&&SESS.role==='trainee'?pageHomeApp():pageHome()},audit:{t:'سجل العمليات',icon:'shield',fn:pageAudit},classes:{t:'جدول الحصص',icon:'classes',fn:()=>{const h=pageClasses2(),i=h.indexOf('</div></div>',h.indexOf('<div class="acts">'))+12;return h.slice(0,i)+unlinkedPanel()+h.slice(i)}},trainers:{t:'المدربون',icon:'trainers',fn:pageTrainers},reports:{t:'التقارير',icon:'reports',fn:pageReports},settings:{t:'الإعدادات',icon:'settings',fn:pageSettings},
 newmember:{t:'عضو جديد',icon:'plus',fn:pageNewMember},schedule:{t:'الجدول الشهري',icon:'classes',fn:pageSchedule},portal:{t:'بطاقة المتدرب',icon:'subs',fn:pagePortal},gate:{t:'بوابة QR',icon:'qr',fn:pageGate},requests:{t:'طلبات التجميد',icon:'warn',fn:pageRequests},trainer:{t:'لوحة المدرب',icon:'trainers',fn:pageTrainer},marketing:{t:'التسويق',icon:'msg',fn:pageMarketing},coach:{t:'لوحة المدربة',icon:'trainers',fn:pageCoach},feedback:{t:'الشكاوى والاقتراحات',icon:'msg',fn:pageFeedback},acct:{t:'المحاسبة والقوائم',icon:'book',fn:pageAcct},site:{t:'الموقع الإلكتروني',icon:'globe',fn:pageSite},blog:{t:'المدونة',icon:'news',fn:pageBlog},imp:{t:'استيراد من النظام السابق',icon:'file',fn:pageImport},clock:{t:'حضور الموظفين',icon:'pinpt',fn:pageClock},bulkapp:{t:'تفعيل دخول المشتركين',icon:'lock',fn:pageBulkApp},acchub:{t:'مركز المحاسب',icon:'calc',fn:pageAccHub},income:{t:'ملف الدخل',icon:'finance',fn:pageIncome},wa:{t:'واتساب النادي',icon:'msg',fn:pageWa},perksAdm:{t:'عروض المشتركين',icon:'gift',fn:pagePerksAdm},perks:{t:'بطاقة الخصومات',icon:'gift',fn:pagePerks},timetable:{t:'جدول الحصص',icon:'classes',fn:pageTimetable},golive:{t:'بدء التشغيل الفعلي',icon:'flag',fn:pageGoLive},news:{t:'المدونة',icon:'news',fn:pageNews},
 daily:{t:'العملاء اليوميون',icon:'day',fn:pageDaily},leads:{t:'العملاء المحتملون',icon:'lead',fn:pageLeads},cashbox:{t:'صندوق المال',icon:'box',fn:pageCashbox}
};
const NAV=[['الرئيسية',['dashboard','home','timetable','news','perks','income']],['الأعضاء',['members','newmember','leads','subs','requests','feedback','schedule','portal']],['الدخول والحضور',['gate','checkin','daily','clock']],['المالية',['acchub','cashbox','finance','acct','shift']],['التشغيل',['coach','pt','classes','trainers']],['التسويق',['wa','marketing','perksAdm','site','blog']],['التحليل',['reports','audit','settings','golive']]];
function shell(){
 $('#app').innerHTML='<div class="shell"><aside class="rail" aria-label="القائمة الرئيسية"><div class="brand"><span class="brandlogo" role="img" aria-label="جولة اللياقة"><i class="t"></i><i class="m"></i></span><small id="gymname"></small></div>'+(can('finance')?'<button type="button" class="inc" data-act="incomeModal" id="incR" aria-label="دخل اليوم، اعرض التفاصيل"></button>':'')+'<nav class="nav">'+NAV.map(g=>[g[0],g[1].filter(k=>can(k)&&(k!=='home'||SESS.role==='trainee')&&(k!=='news'||SESS.role==='trainee'||SESS.role==='trainer')&&(k!=='perks'||SESS.role==='trainee')&&(k!=='timetable'||SESS.role==='trainee'))]).filter(g=>g[1].length).map(g=>'<p class="grp">'+g[0]+'</p>'+g[1].map(k=>'<a href="#'+k+'" data-p="'+k+'">'+ic(PAGES[k].icon)+'<span>'+PAGES[k].t+'</span>'+(k==='requests'?'<em class="badge" id="b-req" hidden></em>':'')+(k==='leads'?'<em class="badge" id="b-lead" hidden></em>':'')+(k==='feedback'?'<em class="badge" id="b-fb" hidden></em>':'')+'</a>').join('')).join('')+'</nav><div class="rfoot"><div class="mode" id="mode"></div><button type="button" class="btn sm" data-act="toggleTheme">'+ic('moon',15)+' تبديل المظهر</button><p id="syncst" class="sync" role="status"></p></div></aside><div class="scrim" data-act="closeMenu"></div><main class="main"><div class="top"><button type="button" class="ib" data-act="openMenu" aria-label="فتح القائمة">'+ic('menu',22)+'</button><b class="tt" id="ttl"></b>'+(can('finance')?'<button type="button" class="btn sm inc-t" data-act="incomeModal" id="incT" aria-label="دخل اليوم"></button>':'')+(can('checkin')?'<button type="button" class="btn sm pri" data-act="goCheckin">'+ic('checkin',15)+' حضور</button>':'')+'</div><div id="view"></div></main></div><div id="toast" role="status" aria-live="polite"></div>';
}
function render(){
 if(!PAGES[U.page])U.page='dashboard';
 const p=PAGES[U.page];
 $('#view').innerHTML=p.fn();
 $('#gymname').textContent='نظام إدارة النادي';$('#ttl').textContent=p.t;
 document.querySelectorAll('.nav a').forEach(a=>{if(a.dataset.p===U.page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 chrome();afterRender();if(CAP)appTick();pwaTick();
}
function route(){
 if(!SESS||!$('.shell'))return;
 const h=(location.hash||'#'+landing()).slice(1);
 U.page=PAGES[h]&&can(h)?h:landing();
 if(PAGES[h]&&!can(h)){try{history.replaceState(null,'','#'+landing())}catch(e){}}
 if(U.page!=='newmember'){U.nmDone='';U.nmTouched=false}
 $('.shell').classList.remove('open');
 render();window.scrollTo(0,0);
 if(U.page==='checkin'){const i=$('#ci');if(i)i.focus()}
}

document.addEventListener('click',e=>{
 const ov=e.target;if(ov.classList&&ov.classList.contains('ov')&&ov.id==='modal'){closeModal();return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const fn=ACT[b.dataset.act];if(fn){e.preventDefault();fn(b.dataset,b)}
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&IN[k])IN[k](e.target.value)});
document.addEventListener('submit',e=>{
 if(e.target.id==='cif'){e.preventDefault();const r=findMembers($('#ci').value);if(!r.length){toast('لم يُعثر على عضو مطابق');return}runCheckin(r[0])}
 if(e.target.id==='setf'){e.preventDefault();const f=e.target,s=S.settings;
  s.gym=f.gym.value.trim()||s.gym;s.pin=f.pin.value.trim()||s.pin;s.soonDays=Math.max(1,+f.soon.value||7);s.churnDays=Math.max(3,+f.churn.value||14);
  ['expiring','expired','away','debt','invoice','lead','bday'].forEach(k=>{s.tpl[k]=f['tpl_'+k].value});s.dailyPrice=Math.max(0,+f.dprice.value||0);s.discLimit=Math.max(0,Math.min(100,+f.disclim.value||0));s.openingCash=+f.opening.value||0;s.portalLink=f.link.value.trim();readSettingsExtra(f,s);save();render();toast('تم حفظ الإعدادات')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal'))closeModal();else if($('.shell'))$('.shell').classList.remove('open')}});
window.addEventListener('hashchange',route);

try{const th=localStorage.getItem('nabd.theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
S=hydrate({});start();
})();
</script>
